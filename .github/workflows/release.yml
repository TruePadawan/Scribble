name: Build and Release Scribble

on:
  pull_request:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  test:
    # Check autosave file handling on both desktop platforms.
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Share the cache with the build job to speed things up
      - name: Cache NuGet Packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Run All Tests
        # This will fail the job if any test in the solution fails
        run: dotnet test --solution Scribble.slnx --verbosity normal

      - name: Publish desktop smoke build
        shell: pwsh
        run: |
          $rid = if ($IsWindows) { 'win-x64' } else { 'linux-x64' }
          dotnet publish Scribble.Desktop -c Release -r $rid --self-contained true -p:PublishSingleFile=true -o "$env:RUNNER_TEMP/desktop"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if (!(Test-Path "$env:RUNNER_TEMP/desktop/appsettings.json")) { throw 'Missing published settings' }
          Move-Item "$env:RUNNER_TEMP/desktop/appsettings.json" "$env:RUNNER_TEMP/published-settings.json"

      - name: Open the published Linux editor offline
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb xdotool
          cd "$RUNNER_TEMP"
          xvfb-run -a bash -ec '
            "$RUNNER_TEMP/desktop/Scribble.Desktop" &
            editor=$!
            trap "kill $editor 2>/dev/null || true" EXIT
            timeout 30 xdotool search --sync --onlyvisible --name "^Scribble$"
          '

      - name: Open the published Windows editor offline
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $editor = Start-Process "$env:RUNNER_TEMP/desktop/Scribble.Desktop.exe" -WorkingDirectory $env:RUNNER_TEMP -PassThru
          try {
            foreach ($attempt in 1..60) {
              $editor.Refresh()
              if ($editor.HasExited) { throw 'Editor exited before showing a window' }
              if ($editor.MainWindowHandle -ne 0) { return }
              Start-Sleep -Milliseconds 500
            }
            throw 'Editor window did not open'
          } finally {
            if (!$editor.HasExited) { $editor.Kill() }
          }

  build-and-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required for creating the GitHub Release

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # CACHING STEP
      - name: Cache NuGet Packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          # Creates a unique key based on the OS and project's dependencies
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          # If an exact match isn't found, it falls back to the closest previous cache
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Setup Ruby (Required for fpm)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm zip libarchive-tools zstd
          gem install fpm

      - name: Make scripts executable
        run: |
          chmod +x ./deploy_linux.sh
          chmod +x ./deploy_windows.sh

      - name: Extract Clean Version Number
        # Strips the leading "v" from the tag (e.g., "v1.1.4" becomes "1.1.4")
        run: |
          CLEAN_VERSION=${GITHUB_REF_NAME#v}
          echo "APP_VERSION=$CLEAN_VERSION" >> $GITHUB_ENV

      - name: Run Deployment Scripts with Tag Version
        run: |
          echo "Building Scribble version $APP_VERSION"
          ./deploy_linux.sh "$APP_VERSION"
          ./deploy_windows.sh "$APP_VERSION"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Scribble ${{ github.ref_name }}"
          files: |
            releases/linux/*
            releases/windows/*
          generate_release_notes: true
